<script>
"use strict";

/* ============================================================ */
/* THEME (in-memory only)                                        */
/* ============================================================ */
let isDark = false; // Mặc định chế độ sáng theo yêu cầu
function applyTheme(){ document.documentElement.classList.toggle('dark', isDark); }
applyTheme();
function themeToggleBtn(){
  const b = document.createElement('button');
  b.className = 'inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-brand-500 transition-colors text-slate-600 dark:text-slate-300';
  b.innerHTML = isDark ? '<i data-lucide="sun" class="w-4 h-4"></i>' : '<i data-lucide="moon" class="w-4 h-4"></i>';
  b.onclick = ()=>{ isDark=!isDark; applyTheme(); renderHeader(); };
  return b;
}

/* ============================================================ */
/* API HELPER                                                    */
/* ============================================================ */
async function api(path, opts={}){
  const res = await fetch('/api'+path, {
    method: opts.method || 'GET',
    headers: {'Content-Type':'application/json'},
    credentials: 'include',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || ('Lỗi '+res.status));
  return data;
}

/* ============================================================ */
/* SESSION STATE (in-memory; cookie is the real source of truth) */
/* ============================================================ */
let currentUser = null; // { id, email, role, credits }

async function loadSession(){
  try { currentUser = await api('/auth/me'); }
  catch { currentUser = null; }
}

/* ============================================================ */
/* ROUTER                                                        */
/* ============================================================ */
function go(path){ history.pushState({}, '', path); render(); }
window.addEventListener('popstate', render);

function updateSEO(config) {
  document.title = config.title;
  document.querySelector('meta[name="description"]').setAttribute('content', config.description);
  document.querySelector('meta[property="og:title"]').setAttribute('content', config.title);
  document.querySelector('meta[property="og:description"]').setAttribute('content', config.description);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', config.title);
  document.querySelector('meta[name="twitter:description"]').setAttribute('content', config.description);
  
  if (config.noindex) {
    document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex,nofollow');
  } else {
    document.querySelector('meta[name="robots"]').setAttribute('content', 'index,follow');
  }

  if (config.schema) {
    document.getElementById('schemaOrg').textContent = JSON.stringify(config.schema);
  }
}

const PUBLIC_ROUTES = ['/', '/features', '/pricing', '/contact'];
const AUTH_ROUTES = ['/login', '/register'];

async function render(){
  renderHeader();
  const app = document.getElementById('app');
  app.innerHTML = '<div class="text-sm text-slate-500 dark:text-slate-400 py-20 text-center">Đang tải…</div>';
  const path = location.pathname;

  if (PUBLIC_ROUTES.includes(path)) {
    if (path === '/') return renderHomeView(app);
    if (path === '/features') return renderFeaturesView(app);
    if (path === '/pricing') return renderPricingView(app);
    if (path === '/contact') return renderContactView(app);
  }

  if (AUTH_ROUTES.includes(path)) {
    if (currentUser) { go('/dashboard'); return; }
    if (path === '/login') return renderAuthView(app, 'login');
    if (path === '/register') return renderAuthView(app, 'register');
  }

  // Private routes
  if (!currentUser) { go('/login'); return; }
  
  if (path === '/profile') return renderProfileView(app);
  if (path === '/dashboard') return renderDashboardView(app);
  
  if (path === '/admin') {
    if(currentUser.role !== 'admin'){ go('/'); return; }
    renderAdminView(app);
  } else {
    app.innerHTML = '<div class="text-center py-20">Trang không tồn tại.</div>';
  }

  if (window.lucide) setTimeout(() => lucide.createIcons(), 0);
}

function renderHeader(){
  const el = document.getElementById('headerActions');
  el.innerHTML = '';
  el.appendChild(themeToggleBtn());
  if(currentUser){
    const balance = document.createElement('span');
    balance.className = 'text-sm font-semibold px-3 py-1.5 rounded-lg bg-brand-50 dark:bg-brand-900/20 text-brand-700 dark:text-brand-400 cursor-pointer';
    balance.textContent = currentUser.credits + ' credit';
    balance.onclick = () => go('/dashboard');
    el.appendChild(balance);

    const profileBtn = document.createElement('button');
    profileBtn.className = 'text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-brand-500';
    profileBtn.textContent = 'Cá nhân';
    profileBtn.onclick = ()=> go('/profile');
    el.appendChild(profileBtn);

    if(currentUser.role === 'admin'){
      const adminBtn = document.createElement('button');
      adminBtn.className = 'text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-brand-500';
      adminBtn.textContent = 'Admin';
      adminBtn.onclick = ()=> go('/admin');
      el.appendChild(adminBtn);
    }
    const logoutBtn = document.createElement('button');
    logoutBtn.className = 'text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-red-400 hover:text-red-500';
    logoutBtn.textContent = 'Đăng xuất';
    logoutBtn.onclick = async ()=>{ await api('/auth/logout',{method:'POST'}); currentUser=null; go('/'); };
    el.appendChild(logoutBtn);
  } else {
    const loginBtn = document.createElement('button');
    loginBtn.className = 'text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-brand-500';
    loginBtn.textContent = 'Đăng nhập';
    loginBtn.onclick = ()=> go('/login');
    el.appendChild(loginBtn);
    
    const regBtn = document.createElement('button');
    regBtn.className = 'text-sm font-medium px-3 py-1.5 rounded-lg bg-brand-500 text-white hover:bg-brand-600';
    regBtn.textContent = 'Đăng ký miễn phí';
    regBtn.onclick = ()=> go('/register');
    el.appendChild(regBtn);
  }
}

async function loadTxHistory(){
  const box = document.getElementById('txHistory');
  try{
    const data = await api('/wallet/transactions');
    const items = data.items.filter(t => t.status !== 'pending'); // Bỏ giao dịch đang chờ
    if(!items.length){ box.innerHTML = '<div class="text-slate-400">Chưa có giao dịch nào.</div>'; return; }
    box.innerHTML = items.map(t=>{
      const sign = t.credits_delta > 0 ? '+' : '';
      const color = t.credits_delta > 0 ? 'text-emerald-500' : 'text-slate-500 dark:text-slate-400';
      const label = t.type==='deposit' ? 'Nạp tiền' : t.type==='usage' ? 'Nâng cấp AI' : 'Admin điều chỉnh';
      return `<div class="flex justify-between border-b border-slate-100 dark:border-slate-800 pb-1.5">
        <span>${label}</span>
        <span class="${color} font-semibold">${sign}${t.credits_delta}</span>
      </div>`;
    }).join('');
  }catch{ box.innerHTML = '<div class="text-red-400">Không tải được lịch sử.</div>'; }
}

function setupUploadAndProcess(){
  const state = { file:null, url:null, name:'', resultURL:null };
  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('fileInput');
  const previewBody = document.getElementById('previewBody');
  const progress = document.getElementById('progress');
  const processBtn = document.getElementById('processBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  ['dragenter','dragover'].forEach(evt=> dz.addEventListener(evt, e=>{e.preventDefault(); dz.classList.add('border-brand-500');}));
  ['dragleave','drop'].forEach(evt=> dz.addEventListener(evt, e=>{e.preventDefault(); dz.classList.remove('border-brand-500');}));
  dz.addEventListener('drop', e=> loadFile(e.dataTransfer.files[0]));
  fileInput.addEventListener('change', e=> loadFile(e.target.files[0]));

  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    state.file = file; state.name = file.name; state.resultURL = null;
    state.url = URL.createObjectURL(file);
    processBtn.disabled = false; downloadBtn.disabled = true;
    renderPreview();
  }

  function renderPreview(){
    if(!state.file){
      previewBody.innerHTML = `<div class="text-center text-sm text-slate-500 dark:text-slate-400 py-16">Chưa có ảnh nào được chọn.</div>`;
      return;
    }
    if(state.resultURL){
      previewBody.innerHTML = `
        <div class="relative w-full aspect-[4/3] bg-slate-100 dark:bg-slate-950 rounded-lg overflow-hidden select-none" id="compareBox">
          <div class="absolute inset-0 flex items-center justify-center"><img src="${state.url}" class="max-w-full max-h-full object-contain" draggable="false"></div>
          <div class="absolute inset-0 flex items-center justify-center" id="afterLayer" style="clip-path:inset(0 0 0 50%)"><img src="${state.resultURL}" class="max-w-full max-h-full object-contain" draggable="false"></div>
          <span class="absolute top-3 left-3 text-[11px] font-bold px-2 py-1 rounded-full bg-black/60 text-white">trước</span>
          <span class="absolute top-3 right-3 text-[11px] font-bold px-2 py-1 rounded-full bg-brand-600/90 text-white">sau</span>
          <div class="absolute top-0 bottom-0 w-0.5 bg-brand-500" id="handle" style="left:50%">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center shadow-lg cursor-ew-resize text-white text-xs">⇔</div>
          </div>
        </div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mt-3 pb-2">Đã nâng cấp bằng Real-ESRGAN</div>`;
      const box = document.getElementById('compareBox'), handle = document.getElementById('handle'), after = document.getElementById('afterLayer');
      let dragging=false;
      function setPos(x){ const r=box.getBoundingClientRect(); let p=Math.max(0,Math.min(100,((x-r.left)/r.width)*100)); handle.style.left=p+'%'; after.style.clipPath=`inset(0 0 0 ${p}%)`; }
      handle.addEventListener('pointerdown', e=>{dragging=true; handle.setPointerCapture(e.pointerId);});
      window.addEventListener('pointermove', e=>{if(dragging) setPos(e.clientX);});
      window.addEventListener('pointerup', ()=> dragging=false);
      box.addEventListener('click', e=>{ if(e.target===box) setPos(e.clientX); });
    } else {
      previewBody.innerHTML = `
        <div class="rounded-lg overflow-hidden bg-slate-100 dark:bg-slate-950 flex items-center justify-center" style="aspect-ratio:4/3">
          <img src="${state.url}" class="max-w-full max-h-full object-contain">
        </div>
        <div class="text-xs text-slate-500 dark:text-slate-400 mt-3 pb-2">Ảnh gốc, chưa xử lý</div>`;
    }
  }

  function fileToDataURL(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  processBtn.addEventListener('click', async ()=>{
    if(!state.file) return;
    processBtn.disabled = true;
    progress.textContent = 'Đang gửi ảnh…';
    try{
      const dataUrl = await fileToDataURL(state.file);
      progress.textContent = 'Mô hình đang xử lý…';
      const data = await api('/upscale', { method:'POST', body:{ image: dataUrl, scale: 4, face_enhance: false } });
      state.resultURL = data.outputUrl;
      currentUser.credits = data.creditsRemaining;
      renderHeader();
      progress.textContent = `Hoàn tất — đã trừ ${data.creditsCharged} credit.`;
      downloadBtn.disabled = false;
      renderPreview();
      loadTxHistory();
    }catch(err){
      progress.textContent = 'Lỗi: ' + err.message;
    }finally{
      processBtn.disabled = false;
    }
  });

  downloadBtn.addEventListener('click', ()=>{
    if(!state.resultURL) return;
    const a = document.createElement('a');
    a.href = state.resultURL; a.download = state.name.replace(/\.[^.]+$/,'')+'-ai.jpg';
    a.click();
  });
}

function setupDepositModal(){
  const modal = document.getElementById('depositModal');
  document.getElementById('openDepositBtn').onclick = ()=>{
    modal.classList.remove('hidden');
    document.getElementById('depositStep1').classList.remove('hidden');
    document.getElementById('depositStep2').classList.add('hidden');
    document.getElementById('depositError').classList.add('hidden');
    document.getElementById('depositAmount').value = '';
  };
  document.getElementById('closeDepositBtn').onclick = ()=>{
    modal.classList.add('hidden');
    if(window.__depositPoll) clearInterval(window.__depositPoll);
  };
  document.getElementById('createDepositBtn').onclick = async ()=>{
    const errBox = document.getElementById('depositError');
    errBox.classList.add('hidden');
    const amountVnd = parseInt(document.getElementById('depositAmount').value, 10);
    try{
      const dep = await api('/wallet/deposits', { method:'POST', body:{ amountVnd } });
      document.getElementById('depositQr').src = dep.qrImageUrl;
      document.getElementById('depositCode').textContent = dep.code;
      document.getElementById('depositStep1').classList.add('hidden');
      document.getElementById('depositStep2').classList.remove('hidden');

      const initialCredits = currentUser.credits;

      window.__depositPoll = setInterval(async ()=>{
        try{
          const me = await api('/auth/me');
          if(me.credits > initialCredits){
            clearInterval(window.__depositPoll);
            document.getElementById('depositWaiting').textContent = '✓ Đã nhận thanh toán!';
            currentUser = me;
            renderHeader();
            setTimeout(()=>{ modal.classList.add('hidden'); loadTxHistory(); }, 1200);
          }
        }catch{}
      }, 4000);
    }catch(err){
      errBox.textContent = err.message;
      errBox.classList.remove('hidden');
    }
  };
}

      <div class="card p-5">
        <h3 class="text-sm font-semibold mb-4">Giao dịch gần đây</h3>
        <div class="space-y-2 text-xs max-h-[500px] overflow-y-auto pr-2">
          ${txs.items.filter(t => t.status !== 'pending').map(t=>`<div class="flex justify-between border-b border-slate-100 dark:border-slate-800 pb-1.5">
            <span>${t.email} · ${t.type}</span>
            <span class="${t.credits_delta>0?'text-emerald-500':'text-slate-400'} font-semibold">${t.credits_delta>0?'+':''}${t.credits_delta}</span>
          </div>`).join('') || '<div class="text-slate-400">Chưa có.</div>'}
        </div>
      </div>
    `,
    usage: () => `
      <div class="card p-5">
        <h3 class="text-sm font-semibold mb-4">Lượt dùng AI gần đây</h3>
        <div class="space-y-2 text-xs max-h-[500px] overflow-y-auto pr-2">
          ${usage.items.map(u=>`<div class="flex justify-between border-b border-slate-100 dark:border-slate-800 pb-1.5">
            <span>${u.email} · ${u.status}</span>
            <span class="text-slate-400">${u.credits_charged} credit</span>
          </div>`).join('') || '<div class="text-slate-400">Chưa có.</div>'}
        </div>
      </div>
    `
  };

  const adminContent = document.getElementById('adminContent');
  const tabBtns = app.querySelectorAll('.admin-tab-btn');

  function selectTab(tabId) {
    currentAdminTab = tabId;
    tabBtns.forEach(b => {
      if (b.dataset.tab === tabId) {
        b.className = 'admin-tab-btn w-full text-left px-4 py-2.5 rounded-lg text-sm flex items-center gap-3 font-bold bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 transition-colors';
      } else {
        b.className = 'admin-tab-btn w-full text-left px-4 py-2.5 rounded-lg text-sm flex items-center gap-3 font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors';
      }
    });
    adminContent.innerHTML = tabs[tabId]();
    if (window.lucide) window.lucide.createIcons();
    bindEvents(tabId);
  }

  function bindEvents(tabId) {
    if (tabId === 'settings') {
      document.getElementById('saveSettingsBtn').onclick = async ()=>{
        try{
          await api('/admin/settings', { method:'POST', body:{
            vnd_per_credit: document.getElementById('s_vnd').value,
            credits_per_upscale: document.getElementById('s_cost').value,
            min_deposit_vnd: document.getElementById('s_min').value,
          }});
          const msg = document.getElementById('settingsMsg');
          msg.classList.remove('hidden');
          setTimeout(()=> msg.classList.add('hidden'), 2000);
        }catch(err){ alert(err.message); }
      };
    } else if (tabId === 'users') {
      document.querySelectorAll('.adjust-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const id = btn.dataset.id;
          const input = document.querySelector(`.adjust-input[data-id="${id}"]`);
          const delta = parseInt(input.value, 10);
          if(!delta) return;
          try{
            await api(`/admin/users/${id}/adjust`, { method:'POST', body:{ delta, note:'Điều chỉnh từ Admin Dashboard' } });
            renderAdminView(app);
          }catch(err){ alert(err.message); }
        };
      });
    }
  }

  tabBtns.forEach(b => b.onclick = () => selectTab(b.dataset.tab));
  selectTab(currentAdminTab);
}

/* ============================================================ */
/* BOOT                                                           */
/* ============================================================ */
(async function boot(){
  await loadSession();
  render();
})();
</script>
</body>
</html>
