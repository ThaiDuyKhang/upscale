  <style>
  /* ============================================================
     BLOG PROSE STYLES — Typography for blog articles
     (replaces @tailwindcss/typography which CDN doesn't include)
  ============================================================ */
  .blog-content {
    font-size: 1.0625rem;
    line-height: 1.8;
    color: #334155;
    word-break: break-word;
  }
  .dark .blog-content { color: #cbd5e1; }

  /* Headings */

  .blog-content h2, .blog-content .ql-editor h2 {
    font-size: 1.6rem; font-weight: 800; line-height: 1.3;
    margin: 2.2rem 0 0.8rem; color: #0f172a;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #e2e8f0;
  }
  .dark .blog-content h2 { color: #f1f5f9; border-bottom-color: #1e293b; }

  .blog-content h3 {
    font-size: 1.28rem; font-weight: 700; line-height: 1.35;
    margin: 1.8rem 0 0.6rem; color: #0f172a;
  }
  .dark .blog-content h3 { color: #f1f5f9; }

  .blog-content h4 {
    font-size: 1.1rem; font-weight: 700;
    margin: 1.5rem 0 0.5rem; color: #1e293b;
  }
  .dark .blog-content h4 { color: #e2e8f0; }

  .blog-content h5, .blog-content h6 {
    font-size: 1rem; font-weight: 600;
    margin: 1.2rem 0 0.4rem; color: #334155;
  }

  /* Quill h2/h3 via data-formula or via class */
  .blog-content .ql-editor h2, .blog-content .ql-editor h3 { margin-top: 1.6rem; }

  /* Paragraphs */
  .blog-content p {
    margin: 0 0 1.1rem;
  }

  /* Blockquote */
  .blog-content blockquote {
    margin: 1.6rem 0;
    padding: 1rem 1.25rem 1rem 1.5rem;
    border-left: 4px solid #06b6d4;
    background: #f0fdff;
    border-radius: 0 0.75rem 0.75rem 0;
    font-style: italic;
    color: #0e7490;
    font-size: 1.05rem;
  }
  .dark .blog-content blockquote {
    background: #0c1a1e;
    color: #67e8f9;
    border-left-color: #22d3ee;
  }

  /* Lists */
  .blog-content ul, .blog-content ol {
    margin: 0.8rem 0 1.2rem 1.5rem;
  }
  .blog-content ul { list-style-type: disc; }
  .blog-content ol { list-style-type: decimal; }
  .blog-content li { margin-bottom: 0.4rem; }
  .blog-content li::marker { color: #06b6d4; }

  /* Quill list classes */
  .blog-content .ql-indent-1 { padding-left: 2em; }
  .blog-content .ql-indent-2 { padding-left: 4em; }
  .blog-content li[data-list="bullet"] { list-style-type: disc; }
  .blog-content li[data-list="ordered"] { list-style-type: decimal; }

  /* Images */
  .blog-content img {
    max-width: 100%;
    border-radius: 0.875rem;
    margin: 1.5rem auto;
    display: block;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
  }

  /* Code */
  .blog-content code {
    background: #f1f5f9;
    color: #0891b2;
    padding: 0.15em 0.4em;
    border-radius: 0.3rem;
    font-size: 0.875em;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
  }
  .dark .blog-content code { background: #1e293b; color: #22d3ee; }

  .blog-content pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 1.25rem 1.5rem;
    border-radius: 0.875rem;
    overflow-x: auto;
    margin: 1.5rem 0;
    font-size: 0.875rem;
    line-height: 1.7;
  }

  /* Links */
  .blog-content a {
    color: #0891b2;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color 0.15s;
  }
  .blog-content a:hover { color: #06b6d4; }

  /* Strong / em */
  .blog-content strong { font-weight: 700; color: #0f172a; }
  .dark .blog-content strong { color: #f1f5f9; }
  .blog-content em { font-style: italic; }

  /* HR */
  .blog-content hr {
    border: none;
    border-top: 2px solid #e2e8f0;
    margin: 2rem 0;
  }
  .dark .blog-content hr { border-top-color: #1e293b; }

  /* Quill-specific heading classes */
  .blog-content [class*="ql-"] h1,
  .blog-content [class*="ql-"] h2 { font-size: 1.6rem; }

  /* Quill outputs .ql-align-center etc */
  .blog-content .ql-align-center { text-align: center; }
  .blog-content .ql-align-right { text-align: right; }
  .blog-content .ql-align-justify { text-align: justify; }

  /* Quill bold/italic are inline, but <strong> and <em> also used */
  /* Quill size classes */
  .blog-content .ql-size-small { font-size: 0.875em; }
  .blog-content .ql-size-large { font-size: 1.25em; font-weight: 600; }
  .blog-content .ql-size-huge  { font-size: 1.6em; font-weight: 800; line-height: 1.3; display: block; margin: 1.5rem 0 0.5rem; color: #0f172a; }
  .dark .blog-content .ql-size-huge { color: #f1f5f9; }

  /* Ensure Quill ol/ul container works */
  .blog-content ol, .blog-content ul { padding-left: 1.5rem; }

  /* Dividers between sections */
  .blog-content > *:first-child { margin-top: 0; }
  </style>

  <script>
    "use strict";

    /* ============================================================ */
    /* THEME (Default: Light mode, persistent in localStorage)      */
    /* ============================================================ */
    let isDark = localStorage.getItem('theme') === 'dark'; // Mặc định là false (sáng)
    function applyTheme() {
      document.documentElement.classList.toggle('dark', isDark);
      try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) { }
    }
    applyTheme();

    function themeToggleBtn() {
      const b = document.createElement('button');
      b.id = 'themeToggleBtn';
      b.className = 'inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-brand-500 transition-colors shadow-sm';
      b.setAttribute('title', isDark ? 'Chuyển sang chế độ sáng' : 'Chuyển sang chế độ tối');
      b.setAttribute('aria-label', 'Toggle theme');

      // Icon Lucide chuẩn bằng SVG trực tiếp:
      // Chế độ tối: hiện icon mặt trời (Sun) màu vàng cam ấm áp text-amber-400
      // Chế độ sáng: hiện icon mặt trăng (Moon) màu xám đậm sang trọng text-slate-700
      b.innerHTML = isDark
        ? `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun text-amber-400 hover:text-amber-300 transition-transform hover:rotate-45"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-moon text-slate-700 hover:text-brand-600 transition-transform hover:-rotate-12"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

      b.onclick = () => {
        isDark = !isDark;
        applyTheme();
        renderHeader();
      };
      return b;
    }

    /* ============================================================ */
    /* API HELPER                                                    */
    /* ============================================================ */
    async function api(path, opts = {}) {
      const isFormData = opts.body instanceof FormData;
      const headers = isFormData ? {} : { 'Content-Type': 'application/json' };
      const res = await fetch('/api' + path, {
        method: opts.method || 'GET',
        headers,
        credentials: 'include',
        body: isFormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Lỗi ' + res.status));
      return data;
    }

    /* ============================================================ */
    /* SESSION STATE (in-memory; cookie is the real source of truth) */
    /* ============================================================ */
    let currentUser = null; // { id, email, role, credits }

    async function loadSession() {
      try { currentUser = await api('/auth/me'); }
      catch { currentUser = null; }
    }

    /* ============================================================ */
    /* ROUTER                                                        */
    /* ============================================================ */
    function go(path) { history.pushState({}, '', path); render(); }
    window.addEventListener('popstate', render);
    function bindLinks(container) {
      container.querySelectorAll('a[data-route]').forEach(a => {
        a.onclick = (e) => { e.preventDefault(); go(a.getAttribute('data-route')); };
      });
    }

    function updateSEO(config) {
      document.title = config.title;
      document.querySelector('meta[name="description"]').setAttribute('content', config.description);
      document.querySelector('meta[property="og:title"]').setAttribute('content', config.title);
      document.querySelector('meta[property="og:description"]').setAttribute('content', config.description);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', config.title);
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', config.description);

      if (config.noindex) {
        document.querySelector('meta[name="robots"]').setAttribute('content', 'noindex,nofollow');
      } else {
        document.querySelector('meta[name="robots"]').setAttribute('content', 'index,follow');
      }

      if (config.schema) {
        document.getElementById('schemaOrg').textContent = JSON.stringify(config.schema);
      }
    }

    const PUBLIC_ROUTES = [
      '/',
      '/cong-cu-ai',
      '/tinh-nang',
      '/bang-gia',
      '/gioi-thieu',
      '/lien-he',
      '/kien-thuc'
    ];
    const AUTH_ROUTES = ['/dang-nhap', '/dang-ky'];

    async function render() {
      renderHeader();
      const app = document.getElementById('app');
      app.innerHTML = '<div class="text-sm text-slate-500 dark:text-slate-400 py-20 text-center">Đang tải…</div>';
      const path = location.pathname;

      if (PUBLIC_ROUTES.includes(path) || path.startsWith('/kien-thuc/')) {
        if (path === '/') renderHomeView(app);
        else if (path === '/tinh-nang') renderFeaturesView(app);
        else if (path === '/bang-gia') await renderPricingView(app);
        else if (path === '/gioi-thieu') renderAboutView(app);
        else if (path === '/cong-cu-ai') renderToolView(app);
        else if (path === '/lien-he') renderContactView(app);
        else if (path === '/kien-thuc') await renderBlogListView(app);
        else if (path.startsWith('/kien-thuc/')) await renderBlogDetailView(app, path.split('/').pop());
      } else if (AUTH_ROUTES.includes(path)) {
        if (currentUser) { go('/bang-dieu-khien'); return; }
        if (path === '/dang-nhap') await renderAuthView(app, 'login');
        if (path === '/dang-ky') await renderAuthView(app, 'register');
      } else if (!currentUser) {
        go('/dang-nhap');
        return;
      } else if (path === '/ca-nhan') {
        renderProfileView(app);
      } else if (path === '/bang-dieu-khien') {
        renderDashboardView(app);
      } else if (path === '/cong-cu-ai') {
        renderToolView(app);
      } else if (path === '/quan-tri') {
        if (currentUser.role !== 'admin') { go('/'); return; }
        renderAdminView(app);
      } else if (path.startsWith('/quan-tri/nguoi-dung/')) {
        if (currentUser.role !== 'admin') { go('/'); return; }
        const uid = parseInt(path.split('/').pop(), 10);
        renderAdminView(app);
        setTimeout(() => openUserDetailModal(uid), 300);
      } else if (path.startsWith('/quan-tri/bai-viet/')) {
        if (currentUser.role !== 'admin') { go('/'); return; }
        const pid = parseInt(path.split('/').pop(), 10);
        renderAdminView(app, { initialTab: 'posts', editPostId: pid });
      } else {
        app.innerHTML = '<div class="text-center py-20">Trang không tồn tại.</div>';
      }

      if (window.lucide) setTimeout(() => { try { lucide.createIcons(); } catch (e) { } }, 0);
    }

    function renderHeader() {
      const el = document.getElementById('headerActions');
      el.innerHTML = '';
      el.appendChild(themeToggleBtn());

      if (currentUser) {
        // Dropdown wrap
        const dropdownWrap = document.createElement('div');
        dropdownWrap.className = 'relative inline-block text-left';
        dropdownWrap.id = 'headerDropdownWrap';

        const isAdmin = currentUser.role === 'admin';
        const initial = (currentUser.email || 'U')[0].toUpperCase();

        const triggerBtn = document.createElement('button');
        triggerBtn.type = 'button';
        triggerBtn.id = 'headerDropdownTrigger';
        triggerBtn.className = isAdmin
          ? 'flex items-center gap-2 text-sm font-semibold px-3 py-1.5 rounded-lg border border-purple-200 dark:border-purple-800/60 bg-purple-50 dark:bg-purple-950/40 text-purple-700 dark:text-purple-300 hover:border-purple-400 transition-all shadow-sm'
          : 'flex items-center gap-2 text-sm font-medium px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 hover:border-brand-500 transition-all shadow-sm';

        triggerBtn.innerHTML = isAdmin
          ? `<span class="w-5 h-5 rounded bg-purple-600 text-white flex items-center justify-center text-[10px] font-extrabold shadow-sm">A</span>
         <span>Admin</span>
         <svg id="headerChevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-200 text-purple-500"><path d="m6 9 6 6 6-6"/></svg>`
          : `<span class="w-5 h-5 rounded-full bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300 flex items-center justify-center text-[10px] font-extrabold shadow-sm">${initial}</span>
         <span class="max-w-[110px] truncate text-xs sm:text-sm font-semibold">${currentUser.email.split('@')[0]}</span>
         <svg id="headerChevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-200 text-slate-400"><path d="m6 9 6 6 6-6"/></svg>`;

        const menu = document.createElement('div');
        menu.id = 'headerDropdownMenu';
        menu.className = 'hidden absolute right-0 mt-2 w-56 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-xl py-1.5 z-50';

        menu.innerHTML = `
      <div class="px-3 py-2.5 border-b border-slate-100 dark:border-slate-800">
        <div class="text-xs font-semibold text-slate-900 dark:text-white truncate">${currentUser.email}</div>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded ${isAdmin ? 'bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}">
            ${isAdmin ? 'Quản trị viên' : 'Thành viên'}
          </span>
        </div>
      </div>

      <div class="p-1 space-y-0.5">

        function toggleMenu(e) {
          if (e) e.stopPropagation();
          const isHidden = menu.classList.contains('hidden');
          menu.classList.toggle('hidden', !isHidden);
          const chevron = triggerBtn.querySelector('#headerChevron');
          if (chevron) chevron.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function closeMenu() {
          menu.classList.add('hidden');
          const chevron = triggerBtn.querySelector('#headerChevron');
          if (chevron) chevron.style.transform = 'rotate(0deg)';
        }

        triggerBtn.onclick = toggleMenu;

        menu.querySelectorAll('a[data-route]').forEach(a => {
          a.onclick = (e) => {
            e.preventDefault();
            closeMenu();
            go(a.getAttribute('data-route'));
          };
        });

        const logoutBtn = menu.querySelector('#headerLogoutBtn');
        if (logoutBtn) {
          logoutBtn.onclick = async (e) => {
            e.preventDefault();
            closeMenu();
            await api('/auth/logout', { method: 'POST' });
            currentUser = null;
            go('/');
          };
        }

        document.addEventListener('click', (e) => {
          if (!dropdownWrap.contains(e.target)) {
            closeMenu();
          }
        });

        dropdownWrap.appendChild(triggerBtn);
        dropdownWrap.appendChild(menu);
        el.appendChild(dropdownWrap);

      } else {
        const loginBtn = document.createElement('button');
        loginBtn.className = 'text-sm font-medium px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:border-brand-500 transition-colors';
        loginBtn.textContent = 'Đăng nhập';

        regBtn.onclick = () => go('/dang-ky');
        el.appendChild(regBtn);

    // ─── Canvas/GPU Upscale Engine ────────────────────────────────────────────────
    // Dùng WebGL fragment shader (GPU) hoặc Canvas 2D để phóng to ảnh bằng thuật toán
    // Bicubic / Lanczos — nhanh, chạy offline, không tốn server, nhưng chất lượng thấp hơn Real-ESRGAN.
    function canvasUpscale(file, scale = 2) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const W = img.naturalWidth * scale;
          const H = img.naturalHeight * scale;

          // Try WebGL with Bicubic shader first
          const glCanvas = document.createElement('canvas');
          glCanvas.width = W; glCanvas.height = H;
          const gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');

          if (gl) {
            const vsSource = `
          attribute vec2 a_position;
          varying vec2 v_texCoord;
          void main() {
            gl_Position = vec4(a_position * 2.0 - 1.0, 0.0, 1.0);
            v_texCoord = vec2(a_position.x, 1.0 - a_position.y);
          }`;
            const fsSource = `
          precision highp float;
          uniform sampler2D u_image;
          uniform vec2 u_resolution;
          varying vec2 v_texCoord;
          vec4 cubic(float v, vec4 c0, vec4 c1, vec4 c2, vec4 c3) {
            vec4 r = c1 + 0.5 * v * (c2 - c0 + v * (2.0*c0 - 5.0*c1 + 4.0*c2 - c3 + v * (3.0*(c1-c2) + c3 - c0)));
            return clamp(r, 0.0, 1.0);
          }
          void main() {
            vec2 texelSize = 1.0 / u_resolution;
            vec2 uv = v_texCoord;
            vec2 pixel = uv * u_resolution - 0.5;
            vec2 f = fract(pixel);
            vec2 p = (floor(pixel) + 0.5) * texelSize;
            vec4 r0 = cubic(f.x,
              texture2D(u_image, p + texelSize * vec2(-1,-1)),
              texture2D(u_image, p + texelSize * vec2( 0,-1)),
              texture2D(u_image, p + texelSize * vec2( 1,-1)),
              texture2D(u_image, p + texelSize * vec2( 2,-1)));
            vec4 r1 = cubic(f.x,
              texture2D(u_image, p + texelSize * vec2(-1, 0)),
              texture2D(u_image, p + texelSize * vec2( 0, 0)),
              texture2D(u_image, p + texelSize * vec2( 1, 0)),
              texture2D(u_image, p + texelSize * vec2( 2, 0)));
            vec4 r2 = cubic(f.x,
              texture2D(u_image, p + texelSize * vec2(-1, 1)),
              texture2D(u_image, p + texelSize * vec2( 0, 1)),
              texture2D(u_image, p + texelSize * vec2( 1, 1)),
              texture2D(u_image, p + texelSize * vec2( 2, 1)));
            vec4 r3 = cubic(f.x,
              texture2D(u_image, p + texelSize * vec2(-1, 2)),
              texture2D(u_image, p + texelSize * vec2( 0, 2)),
              texture2D(u_image, p + texelSize * vec2( 1, 2)),
              texture2D(u_image, p + texelSize * vec2( 2, 2)));
            gl_FragColor = cubic(f.y, r0, r1, r2, r3);
          }`;

            function compileShader(src, type) {
              const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s;
            }
            const prog = gl.createProgram();
            gl.attachShader(prog, compileShader(vsSource, gl.VERTEX_SHADER));
            gl.attachShader(prog, compileShader(fsSource, gl.FRAGMENT_SHADER));
            gl.linkProgram(prog); gl.useProgram(prog);

            // Full-screen quad
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 0, 1, 1, 0, 1, 1]), gl.STATIC_DRAW);
            const loc = gl.getAttribLocation(prog, 'a_position');
            gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

            // Texture
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);

            gl.uniform1i(gl.getUniformLocation(prog, 'u_image'), 0);
            gl.uniform2f(gl.getUniformLocation(prog, 'u_resolution'), img.naturalWidth, img.naturalHeight);
            gl.viewport(0, 0, W, H);
            gl.drawArrays(gl.TRIANGLES, 0, 6);

            resolve(glCanvas.toDataURL('image/jpeg', 0.95));
          } else {
            // Fallback: Canvas 2D high-quality
            const c2 = document.createElement('canvas');
            c2.width = W; c2.height = H;
            const ctx = c2.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, W, H);
            resolve(c2.toDataURL('image/jpeg', 0.95));
          }
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

        const remaining = limit - images.length;

          images.push({ file: f, name: f.name, url: URL.createObjectURL(f), resultURL: null, status: 'waiting', errorMsg: '' });
        });
        if (arr.length > remaining) {
          progress.textContent = `Chỉ tối đa ${limit} ảnh được phép ở chế độ này.`;
        } else {
          progress.textContent = '';
        }
        fileInput.value = '';
        updateActionButtons();
        renderPreview();
      }

      function replaceImage(index) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/png,image/jpeg,image/webp';
        input.onchange = e => {
          const f = e.target.files[0];
          if (!f || !f.type.startsWith('image/')) return;
          URL.revokeObjectURL(images[index].url);
          if (images[index].resultURL) URL.revokeObjectURL(images[index].resultURL);
          images[index] = { file: f, name: f.name, url: URL.createObjectURL(f), resultURL: null, status: 'waiting', errorMsg: '' };
          updateActionButtons();
          renderPreview();
        };
        input.click();
      }

      function removeImage(index) {
        URL.revokeObjectURL(images[index].url);
        if (images[index].resultURL) URL.revokeObjectURL(images[index].resultURL);
        images.splice(index, 1);
        updateActionButtons();
        renderPreview();
      }

      function updateActionButtons() {
        const hasImages = images.length > 0;
        processBtn.disabled = !hasImages;
        if (canvasBtn) canvasBtn.disabled = !hasImages;
      }

      function renderPreview() {
        const freeLocked = isFreeMode();
        if (!images.length) {
          previewBody.innerHTML = `<div class="text-center text-sm text-slate-500 dark:text-slate-400 py-16">Chưa có ảnh nào được chọn.</div>`;
          return;
        }
        const limit = freeLocked ? FREE_MAX : MAX_IMAGES;
        previewBody.innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3" id="imgGrid">
        ${images.map((img, i) => {
          const isOverLimit = freeLocked && i >= FREE_MAX;
          return `
            <div class="relative group rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-900 aspect-square border-2 ${isOverLimit ? 'border-red-400' :
              img.status === 'done' ? 'border-emerald-500' :
                img.status === 'error' ? 'border-red-400' :
                  img.status === 'processing' ? 'border-brand-400 animate-pulse' :
                    'border-transparent'
            }" data-index="${i}">
              <img src="${img.resultURL || img.url}" class="w-full h-full object-cover">
              
              ${isOverLimit ? `
                <!-- Free mode overlay warning -->
                <div class="absolute inset-0 bg-black/40 flex items-end justify-center pb-2 pointer-events-none">
                  <span class="text-[11px] font-bold px-2 py-1 rounded bg-amber-400 text-black">⚠ Miễn phí chỉ được tải lên 1 ảnh</span>
                </div>` : ''}

              ${!isOverLimit ? (`
                ${img.status === 'done' ? '<span class="absolute bottom-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500 text-white">✓ Hoàn tất</span>' :
                img.status === 'processing' ? '<span class="absolute bottom-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-brand-500 text-white">Đang xử lý…</span>' :
                  img.status === 'error' ? '<span class="absolute bottom-2 left-2 text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-500 text-white" title="' + img.errorMsg + '">✗ Lỗi</span>' : ''}
              `) : ''}

              <!-- Hover overlay with action buttons (always show) -->
              <div class="absolute inset-0 ${isOverLimit ? 'bg-transparent' : 'bg-black/0 group-hover:bg-black/30'} transition-colors flex items-start justify-end p-2 gap-1.5 ${isOverLimit ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}">
                <!-- Đổi ảnh khác -->
                ${!isOverLimit ? `<button onclick="window.__toolReplaceImage(${i})" class="w-8 h-8 rounded-full bg-white/90 hover:bg-white text-slate-700 flex items-center justify-center shadow-lg transition-all" title="Đổi ảnh khác">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>` : ''}
                <!-- Xóa -->
                <button onclick="window.__toolRemoveImage(${i})" class="w-8 h-8 rounded-full bg-red-500/90 hover:bg-red-500 text-white flex items-center justify-center shadow-lg transition-all" title="Xóa ảnh">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>

              ${img.status === 'done' && !isOverLimit ? `
                <button onclick="window.__toolDownloadOne(${i})" class="absolute bottom-2 right-2 w-7 h-7 rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-lg transition-all" title="Tải về">
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m19 9-7 6-7-6"/><path d="M19 21H5"/></svg>
                </button>` : ''}
            </div>
          `;
        }).join('')}
        ${images.length < limit ? `
          <label class="flex flex-col items-center justify-center aspect-square rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-brand-400 cursor-pointer transition-colors text-slate-400 hover:text-brand-500">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            <span class="text-xs mt-1">Thêm ảnh</span>
            <input type="file" accept="image/png,image/jpeg,image/webp" multiple class="hidden" id="addMoreInput">
          </label>` : ''}
      </div>
    `;

        const addMore = document.getElementById('addMoreInput');
        if (addMore) addMore.addEventListener('change', e => addFiles(e.target.files));

        window.__toolReplaceImage = (i) => replaceImage(i);
        window.__toolRemoveImage = (i) => removeImage(i);
        window.__toolDownloadOne = (i) => {
          if (!images[i] || !images[i].resultURL) return;
          const a = document.createElement('a');
          a.href = images[i].resultURL;
          a.download = images[i].name.replace(/\.[^.]+$/, '') + '-upscaled.jpg';
          a.click();
        };

        // ─── ZIP download button (rendered inline after grid) ─────────────────────
        const hasDoneImages = images.some(img => img.status === 'done');
        let zipBar = document.getElementById('zipDownloadBar');
        if (!zipBar) {
          zipBar = document.createElement('div');
          zipBar.id = 'zipDownloadBar';
          previewBody.appendChild(zipBar);
        }
        if (hasDoneImages) {
          const doneCount = images.filter(i => i.status === 'done').length;
          zipBar.innerHTML = `
        <div class="mt-3 flex items-center gap-3 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800">
          <button onclick="window.__toolDownloadZip()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white text-sm font-bold shadow transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Tải tất cả (.zip)
          </button>
          <span class="text-xs text-emerald-700 dark:text-emerald-400 font-medium">${doneCount} ảnh đã xử lý xong</span>
        </div>`;
        } else {
          zipBar.innerHTML = '';
        }
      }

      // ─── ZIP archive builder ──────────────────────────────────────────────────────
      window.__toolDownloadZip = async () => {
        const done = images.filter(i => i.status === 'done' && i.resultURL);
        if (!done.length) return;
        if (typeof JSZip === 'undefined') {
          alert('JSZip chưa tải xong, vui lòng thử lại sau vài giây.'); return;
        }
        progress.textContent = 'Đang nén file ZIP…';
        try {
          const zip = new JSZip();
          for (let idx = 0; idx < done.length; idx++) {
            const img = done[idx];
            progress.textContent = `Đang nén ảnh ${idx + 1}/${done.length}…`;
            const baseName = img.name.replace(/\.[^.]+$/, '') + '-upscaled.jpg';
            if (img.resultURL.startsWith('data:')) {
              // Canvas GPU result — data URL, convert base64 directly
              const base64 = img.resultURL.split(',')[1];
              zip.file(baseName, base64, { base64: true });
            } else {
              // AI result — fetch from Replicate CDN URL
              const resp = await fetch(img.resultURL);
              if (!resp.ok) throw new Error(`Không tải được ảnh: ${baseName}`);
              const blob = await resp.blob();
              zip.file(baseName, blob);
            }
          }
          const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'xuongnet-upscaled.zip';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(a.href), 8000);
          progress.textContent = `✓ Đã tải ${done.length} ảnh (ZIP).`;
        } catch (err) {
          progress.textContent = 'Lỗi tạo ZIP: ' + err.message;
        }
      };

      function fileToDataURL(file) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }

      processBtn.addEventListener('click', async () => {
        if (!images.length) return;

        // ── Canvas GPU modes ────────────────────────────────────────────────────────
        if (window.activeTool === 'canvas-paid' || window.activeTool === 'canvas-free') {
          const mode = window.activeTool === 'canvas-free' ? 'free' : 'paid';
          const scale = getScale();
          const maxIdx = mode === 'free' ? FREE_MAX : MAX_IMAGES;
          const toProcess = images.slice(0, maxIdx).filter(i => i.status === 'waiting' || i.status === 'error');
          if (!toProcess.length) { progress.textContent = 'Không có ảnh nào cần xử lý.'; return; }
          if (mode === 'paid' && currentUser?.role !== 'admin' && (currentUser?.credits || 0) < canvasQuota.creditCost * toProcess.length) {
            progress.textContent = `Không đủ credit. Cần ${canvasQuota.creditCost * toProcess.length} credit.`; return;
          }
          processBtn.disabled = true;
          let successCount = 0, failCount = 0;
          for (let i = 0; i < Math.min(images.length, maxIdx); i++) {
            if (images[i].status !== 'waiting' && images[i].status !== 'error') continue;
            images[i].status = 'processing';
            renderPreview();
            progress.textContent = `⚡ GPU đang xử lý ảnh ${i + 1}…`;
            try {
              const resultDataUrl = await canvasUpscale(images[i].file, scale);
              const data = await api('/wallet/canvas-done', { method: 'POST', body: { mode } });
              images[i].resultURL = resultDataUrl;
              images[i].status = 'done';
              currentUser.credits = data.userCredits;
              if (mode === 'free') {
                canvasQuota.remainingFree = data.remainingFree;
                const ql = document.getElementById('canvasQuotaLabel');
                if (ql) ql.textContent = data.remainingFree > 0
                  ? data.remainingFree + '/' + canvasQuota.freePerDay + ' lượt'
                  : 'Hết lượt';
              }
              renderHeader();
              successCount++;
            } catch (err) {
              images[i].status = 'error';
              images[i].errorMsg = err.message;
              failCount++;
            }
            renderPreview();
          }
          progress.textContent = `⚡ GPU hoàn tất ${successCount} ảnh${failCount ? `, lỗi ${failCount}` : ''}.`;
          updateActionButtons();
          loadTxHistory && loadTxHistory();
          return;
        }

        // ── AI model modes (realesrgan / gfpgan) ────────────────────────────────────
        const scale = getScale();
        const face_enhance = getFaceEnhance();
        const toProcess = images.filter(i => i.status === 'waiting' || i.status === 'error');
        if (!toProcess.length) { progress.textContent = 'Không có ảnh nào cần xử lý.'; return; }

        processBtn.disabled = true;
        let successCount = 0, failCount = 0;
        for (let i = 0; i < images.length; i++) {
          if (images[i].status !== 'waiting' && images[i].status !== 'error') continue;
          images[i].status = 'processing';
          renderPreview();
          progress.textContent = `✨ AI đang xử lý ảnh ${i + 1}/${images.length}…`;
          try {
            const dataUrl = await fileToDataURL(images[i].file);
            let data;
            if (window.activeTool === 'gfpgan') {
              const gfpSlider = document.getElementById('gfpScaleSlider');
              const gfpScale = gfpSlider ? parseFloat(gfpSlider.value) : 2;
              const gfpVersionEl = document.querySelector('input[name="gfpVersion"]:checked');
              const gfpVersion = gfpVersionEl ? gfpVersionEl.value : 'v1.4';
              data = await api('/upscale/gfpgan', { method: 'POST', body: { image: dataUrl, scale: gfpScale, version: gfpVersion } });
            } else {
              data = await api('/upscale', { method: 'POST', body: { image: dataUrl, scale, face_enhance } });
            }
            images[i].resultURL = data.outputUrl;
            images[i].status = 'done';
            currentUser.credits = data.creditsRemaining;
            renderHeader();
            successCount++;
          } catch (err) {
            images[i].status = 'error';
            images[i].errorMsg = err.message;
            failCount++;
          }
          renderPreview();
        }
        progress.textContent = `✨ Hoàn tất ${successCount} ảnh${failCount ? `, lỗi ${failCount}` : ''}.`;
        updateActionButtons();
        loadTxHistory && loadTxHistory();
      });

      // Canvas GPU handler merged into unified processBtn above

      // Batch download handled via __toolDownloadZip rendered in previewBody
    }

    function setupDepositModal() {
      const modal = document.getElementById('depositModal');
      document.getElementById('openDepositBtn').onclick = () => {
        modal.classList.remove('hidden');
        document.getElementById('depositStep1').classList.remove('hidden');
        document.getElementById('depositStep2').classList.add('hidden');
        document.getElementById('depositError').classList.add('hidden');
        document.getElementById('depositAmount').value = '';
      };
      document.getElementById('closeDepositBtn').onclick = () => {
        modal.classList.add('hidden');
        if (window.__depositPoll) clearInterval(window.__depositPoll);
      };
      document.getElementById('createDepositBtn').onclick = async () => {
        const errBox = document.getElementById('depositError');
        errBox.classList.add('hidden');
        const amountVnd = parseInt(document.getElementById('depositAmount').value, 10);
        try {
          const dep = await api('/wallet/deposits', { method: 'POST', body: { amountVnd } });
          document.getElementById('depositQr').src = dep.qrImageUrl;
          document.getElementById('depositCode').textContent = dep.code;
          document.getElementById('depositStep1').classList.add('hidden');
          document.getElementById('depositStep2').classList.remove('hidden');

          const initialCredits = currentUser.credits;

          window.__depositPoll = setInterval(async () => {
            try {
              const me = await api('/auth/me');
              if (me.credits > initialCredits) {
                clearInterval(window.__depositPoll);
                document.getElementById('depositWaiting').textContent = '✓ Đã nhận thanh toán!';
                currentUser = me;
                renderHeader();
                setTimeout(() => { modal.classList.add('hidden'); loadTxHistory(); }, 1200);
              }
            } catch { }
          }, 4000);
        } catch (err) {
          errBox.textContent = err.message;
          errBox.classList.remove('hidden');
        }
      };
    }

      `;

      const adminContent = document.getElementById('adminContent');
      const tabBtns = app.querySelectorAll('.admin-tab-btn');

      function selectTab(tabId) {
        currentAdminTab = tabId;
        tabBtns.forEach(b => {
          if (b.dataset.tab === tabId) {
            b.className = 'admin-tab-btn w-full text-left px-4 py-2.5 rounded-lg text-sm flex items-center gap-3 font-bold bg-brand-50 dark:bg-brand-900/20 text-brand-600 dark:text-brand-400 transition-colors';
          } else {
            b.className = 'admin-tab-btn w-full text-left px-4 py-2.5 rounded-lg text-sm flex items-center gap-3 font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors';
          }
        });
        adminContent.innerHTML = tabs[tabId]();
        if (window.lucide) window.lucide.createIcons();
        bindEvents(tabId);
      }

      function bindEvents(tabId) {
        if (tabId === 'settings') {
          document.getElementById('saveSettingsBtn').onclick = async () => {
            try {
              await api('/admin/settings', {
                method: 'POST', body: {
                  vnd_per_credit: document.getElementById('s_vnd').value,
                  credits_per_upscale: document.getElementById('s_cost').value,
                  min_deposit_vnd: document.getElementById('s_min').value,
                }
              });
              const msg = document.getElementById('settingsMsg');
              msg.classList.remove('hidden');
              setTimeout(() => msg.classList.add('hidden'), 2000);
            } catch (err) { alert(err.message); }
          };
        } else if (tabId === 'users') {
          document.querySelectorAll('.adjust-btn').forEach(btn => {
            btn.onclick = async () => {
              const id = btn.dataset.id;
              const input = document.querySelector(`.adjust-input[data-id="${id}"]`);
              const delta = parseInt(input.value, 10);
              if (!delta) return;
              try {
                await api(`/admin/users/${id}/adjust`, { method: 'POST', body: { delta, note: 'Điều chỉnh từ Admin Dashboard' } });
                renderAdminView(app);
              } catch (err) { alert(err.message); }
            };
          });
          document.querySelectorAll('.ban-btn').forEach(btn => {
            btn.onclick = async () => {
              try {
                await api('/admin/users/' + btn.dataset.id + '/toggle-ban', { method: 'POST' });
                renderAdminView(app);
              } catch (e) { alert(e.message); }
            }
          });
          document.querySelectorAll('.user-detail-btn').forEach(btn => {
            btn.onclick = () => openUserDetailModal(parseInt(btn.dataset.id, 10), btn.dataset.email);
          });
        } else if (tabId === 'deposits') {
          document.querySelectorAll('.approve-btn').forEach(btn => {
            btn.onclick = async () => {
              if (!confirm('Xác nhận đã nhận đủ tiền và cộng credit cho user?')) return;
              try {
                await api('/admin/deposits/' + btn.dataset.id + '/approve', { method: 'POST' });
                renderAdminView(app);
              } catch (e) { alert(e.message); }
            };
          });
        } else if (tabId === 'coupons') {
          document.getElementById('createCouponBtn').onclick = async () => {
            try {
              await api('/admin/coupons', {
                method: 'POST', body: {
                  code: document.getElementById('c_code').value,
                  credits: document.getElementById('c_credits').value,
                  max_uses: document.getElementById('c_max').value
                }
              });
              renderAdminView(app);
            } catch (e) { alert(e.message); }
          };
          document.querySelectorAll('.toggle-coupon-btn').forEach(btn => {
            btn.onclick = async () => {
              try {
                await api('/admin/coupons/' + btn.dataset.id + '/toggle', { method: 'POST' });
                renderAdminView(app);
              } catch (e) { alert(e.message); }
            };
          });
        } else if (tabId === 'media') {
          const grid = document.getElementById('tab-media-grid');
          const fileInput = document.getElementById('tab-media-upload');
          
          async function loadTabMedia() {
            try {
              const data = await api('/admin/media');
              if(!data.items || data.items.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-500">Chưa có ảnh nào.</div>';
                return;
              }
              grid.innerHTML = data.items.map(m => `
                <div class="group relative aspect-square rounded-xl overflow-hidden bg-slate-200 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
                  <img src="${m.url}" class="w-full h-full object-cover">
                  <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-2">
                    <button class="bg-white/20 hover:bg-white/40 text-white p-2 rounded-lg transition-colors" onclick="navigator.clipboard.writeText(window.location.origin + '${m.url}'); alert('Đã copy link!');" title="Copy link"><i data-lucide="link" class="w-4 h-4"></i></button>
                    <button class="bg-red-500/80 hover:bg-red-500 text-white p-2 rounded-lg transition-colors tab-media-del" data-id="${m.id}" title="Xóa"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                </div>
              `).join('');
              if(window.lucide) window.lucide.createIcons({root: grid});
              
              grid.querySelectorAll('.tab-media-del').forEach(btn => {
                btn.onclick = async () => {
                  if(!confirm('Xóa ảnh này? Khỏi hệ thống hoàn toàn.')) return;
                  try {
                    await api('/admin/media/' + btn.dataset.id, { method: 'DELETE' });
                    loadTabMedia();
                  } catch(e) { alert(e.message); }
                };
              });
            } catch(e) { grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-500">${e.message}</div>`; }
          }
          
          fileInput.onchange = async (e) => {
            const files = e.target.files;
            if(!files.length) return;
            const prevHtml = grid.innerHTML;
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-brand-500 flex flex-col items-center gap-3"><svg class="animate-spin h-8 w-8 text-brand-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> <span>Đang tải lên...</span></div>';
            for(let file of files) {
              const formData = new FormData();
              formData.append('file', file);
              try { await api('/admin/media', { method: 'POST', body: formData }); } catch(err) { alert(err.message); }
            }
            loadTabMedia();
          };
          loadTabMedia();
        } else if (tabId === 'posts') {
          let quill;
          if (!document.querySelector('.ql-toolbar')) {
            quill = new window.Quill('#quillEditor', {
              theme: 'snow',
              modules: {
                toolbar: {
                  container: [
                    [{ 'header': [2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image', 'blockquote', 'code-block'],
                    ['clean']
                  ],
                  handlers: {
                    image: function() {
                      openMediaModal({
                        onSelect: (url) => {
                          const range = quill.getSelection() || { index: quill.getLength() };
                          quill.insertEmbed(range.index, 'image', url);
                        }
                      });
                    }
                  }
                }
              }
            });
          }

          document.getElementById('btn_choose_thumbnail').onclick = () => {
             openMediaModal({
               onSelect: (url) => { document.getElementById('p_thumbnail').value = url; }
             });
          };

          const editorDiv = document.getElementById('adminPostEditor');
          const resetEditor = () => {
            document.getElementById('p_id').value = '';
            document.getElementById('p_title').value = '';
            document.getElementById('p_slug').value = '';
            if(quill) quill.root.innerHTML = '';
            document.getElementById('p_focus_keyword').value = '';
            document.getElementById('p_seo_title').value = '';
            document.getElementById('p_seo_description').value = '';
            document.getElementById('p_is_published').checked = false;
            document.getElementById('p_thumbnail').value = '';
            document.getElementById('p_schema').value = '';
            updateSeoBars();
          };

          document.getElementById('adminNewPostBtn').onclick = () => {
            resetEditor();
            document.getElementById('editorTitle').textContent = 'Viết bài mới';
            editorDiv.classList.remove('hidden');
          };
          document.getElementById('closeEditorBtn').onclick = () => {
            editorDiv.classList.add('hidden');
          };

          const updateSeoBars = () => {
            const title = document.getElementById('p_seo_title').value;
            const desc = document.getElementById('p_seo_description').value;
            document.getElementById('p_seo_title_len').textContent = title.length + ' / 60';
            document.getElementById('p_seo_title_bar').style.width = Math.min(100, (title.length/60)*100) + '%';
            document.getElementById('p_seo_title_bar').className = title.length > 60 ? 'h-full bg-red-500' : (title.length > 40 ? 'h-full bg-emerald-500' : 'h-full bg-amber-500');
            
            document.getElementById('p_seo_desc_len').textContent = desc.length + ' / 160';
            document.getElementById('p_seo_desc_bar').style.width = Math.min(100, (desc.length/160)*100) + '%';
            document.getElementById('p_seo_desc_bar').className = desc.length > 160 ? 'h-full bg-red-500' : (desc.length > 120 ? 'h-full bg-emerald-500' : 'h-full bg-amber-500');
          };
          
          document.getElementById('p_seo_title').oninput = updateSeoBars;
          document.getElementById('p_seo_description').oninput = updateSeoBars;
          
          document.getElementById('p_title').onblur = (e) => {
             const slugInput = document.getElementById('p_slug');
             if (!slugInput.value && e.target.value) {
                slugInput.value = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
             }
          };

          document.getElementById('savePostBtn').onclick = async () => {
            const id = document.getElementById('p_id').value;
            const body = {
              title: document.getElementById('p_title').value,
              slug: document.getElementById('p_slug').value,
              content: quill ? quill.root.innerHTML : '',
              focus_keyword: document.getElementById('p_focus_keyword').value,
              seo_title: document.getElementById('p_seo_title').value,
              seo_description: document.getElementById('p_seo_description').value,
              is_published: document.getElementById('p_is_published').checked,
              thumbnail_url: document.getElementById('p_thumbnail').value,
              schema_json: document.getElementById('p_schema').value
            };
            
            const originalBtn = document.getElementById('savePostBtn').innerHTML;
            document.getElementById('savePostBtn').innerHTML = 'Đang lưu...';
            try {
              if (id) await api('/admin/posts/' + id, { method: 'PUT', body });
              else await api('/admin/posts', { method: 'POST', body });
              renderAdminView(app);
            } catch (err) { 
              alert(err.message); 
              document.getElementById('savePostBtn').innerHTML = originalBtn;
            }
          };

          document.querySelectorAll('.edit-post-btn').forEach(btn => {
            btn.onclick = async () => {
              try {
                const post = await api('/admin/posts/' + btn.dataset.id);
                resetEditor();
                document.getElementById('p_id').value = post.id;
                document.getElementById('p_title').value = post.title;
                document.getElementById('p_slug').value = post.slug;
                if(quill) quill.root.innerHTML = post.content || '';
                document.getElementById('p_focus_keyword').value = post.focus_keyword || '';
                document.getElementById('p_seo_title').value = post.seo_title || '';
                document.getElementById('p_seo_description').value = post.seo_description || '';
                document.getElementById('p_is_published').checked = !!post.is_published;
                document.getElementById('p_thumbnail').value = post.thumbnail_url || '';
                document.getElementById('p_schema').value = post.schema_json || '';
                updateSeoBars();
                
                document.getElementById('editorTitle').textContent = 'Sửa bài viết';
                editorDiv.classList.remove('hidden');
                editorDiv.scrollIntoView({ behavior: 'smooth' });
              } catch (err) { alert(err.message); }
            };
          });

          document.querySelectorAll('.delete-post-btn').forEach(btn => {
            btn.onclick = async () => {
              if (!confirm('Xóa bài viết này? Hành động này không thể hoàn tác.')) return;
              try {
                await api('/admin/posts/' + btn.dataset.id, { method: 'DELETE' });
                renderAdminView(app);
              } catch(err) { alert(err.message); }
            }
          });
        }
      }

      tabBtns.forEach(b => b.onclick = () => selectTab(b.dataset.tab));
      selectTab(currentAdminTab);
      
      if (options.editPostId && currentAdminTab === 'posts') {
        setTimeout(() => {
          const editBtn = document.querySelector(`.edit-post-btn[data-id="${options.editPostId}"]`);
          if (editBtn) editBtn.click();
        }, 100);
      }
    }

    /* ============================================================ */
    /* ADMIN USER DETAIL MODAL                                       */
    /* ============================================================ */
    async function openUserDetailModal(userId, emailHint) {
      // Remove old modal if any
      const old = document.getElementById('userDetailModal');
      if (old) old.remove();

      // Create overlay
      const overlay = document.createElement('div');
      overlay.id = 'userDetailModal';
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4';
      overlay.innerHTML = `
    <div class="relative bg-white dark:bg-slate-900 rounded-2xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden border border-slate-200 dark:border-slate-700">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800">
        <div>
          <h2 class="text-sm font-extrabold" id="udm-title">Chi tiết người dùng</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5" id="udm-sub">Đang tải…</p>
        </div>
        <button id="udm-close" class="w-8 h-8 rounded-lg flex items-center justify-center border border-slate-200 dark:border-slate-700 hover:border-red-400 hover:text-red-500 transition-colors text-lg leading-none">&times;</button>
      </div>
      <div class="flex gap-1 px-6 pt-4 border-b border-slate-200 dark:border-slate-800">
        <button class="udm-tab px-4 py-2 text-xs font-semibold rounded-t-lg border border-b-0 border-transparent transition-colors" data-tab="tx" id="udm-tab-tx">Giao dịch</button>
        <button class="udm-tab px-4 py-2 text-xs font-semibold rounded-t-lg border border-b-0 border-transparent transition-colors" data-tab="usage" id="udm-tab-usage">Lượt nâng cấp AI</button>
      </div>
      <div class="flex-1 overflow-y-auto p-6" id="udm-content">
        <div class="text-xs text-slate-400 text-center py-10">Đang tải dữ liệu…</div>
      </div>
    </div>
  `;
      document.body.appendChild(overlay);

      document.getElementById('udm-close').onclick = () => overlay.remove();
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

      // Fetch data in parallel
      let userData, txData, usageData;
      try {
        [userData, txData, usageData] = await Promise.all([
          api(`/admin/users/${userId}`),
          api(`/admin/users/${userId}/transactions`),
          api(`/admin/users/${userId}/usage`),
        ]);
      } catch (err) {
        document.getElementById('udm-content').innerHTML = `<p class="text-xs text-red-500">${err.message}</p>`;
        return;
      }

      document.getElementById('udm-title').textContent = userData.email;
      document.getElementById('udm-sub').innerHTML =
        `<span class="font-semibold text-brand-600 dark:text-brand-400">${userData.credits} credit</span> &nbsp;·&nbsp; vai trò: ${userData.role} &nbsp;·&nbsp; tham gia: ${new Date(userData.created_at).toLocaleDateString('vi-VN')}`;

      function txHTML() {
        if (!txData.items.length) return '<div class="text-xs text-slate-400 py-6 text-center">Chưa có giao dịch nào.</div>';
        return `<table class="w-full text-xs">
      <thead><tr class="text-left text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
        <th class="py-2 pr-3">Loại</th><th class="py-2 pr-3">Trạng thái</th><th class="py-2 pr-3">Số credit</th><th class="py-2 pr-3">Số tiền VNĐ</th><th class="py-2 pr-3">Ghi chú</th><th class="py-2">Thời gian</th>
      </tr></thead>
      <tbody>
        ${txData.items.map(t => `
          <tr class="border-b border-slate-100 dark:border-slate-800">
            <td class="py-2 pr-3">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold
                ${t.type === 'deposit' ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400'
            : t.type === 'usage' || t.type === 'canvas_usage' ? 'bg-orange-100 dark:bg-orange-900/40 text-orange-700 dark:text-orange-400'
              : 'bg-purple-100 dark:bg-purple-900/40 text-purple-700 dark:text-purple-400'}">
                ${t.type}
              </span>
            </td>
            <td class="py-2 pr-3">
              <span class="${t.status === 'completed' ? 'text-emerald-500' : t.status === 'pending' ? 'text-amber-500' : 'text-red-500'}">${t.status}</span>
            </td>
            <td class="py-2 pr-3 font-semibold ${t.credits_delta > 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}">
              ${t.credits_delta > 0 ? '+' : ''}${t.credits_delta}
            </td>
            <td class="py-2 pr-3 text-slate-500">${t.amount_vnd ? t.amount_vnd.toLocaleString('vi-VN') + 'đ' : '—'}</td>
            <td class="py-2 pr-3 text-slate-400 max-w-[120px] truncate" title="${t.note || ''}">  ${t.note || '—'}</td>
            <td class="py-2 text-slate-400">${new Date(t.created_at).toLocaleString('vi-VN')}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
      }

      function usageHTML() {
        if (!usageData.items.length) return '<div class="text-xs text-slate-400 py-6 text-center">Chưa có lượt nào.</div>';
        return `<table class="w-full text-xs">
      <thead><tr class="text-left text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
        <th class="py-2 pr-3">Trạng thái</th><th class="py-2 pr-3">Credit trừ</th><th class="py-2 pr-3">Scale</th><th class="py-2 pr-3">Face</th><th class="py-2 pr-3">Kết quả</th><th class="py-2">Thời gian</th>
      </tr></thead>
      <tbody>
        ${usageData.items.map(u => `
          <tr class="border-b border-slate-100 dark:border-slate-800">
            <td class="py-2 pr-3">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${u.status === 'succeeded' ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400' : 'bg-red-100 dark:bg-red-900/40 text-red-700 dark:text-red-400'}">${u.status}</span>
            </td>
            <td class="py-2 pr-3 font-semibold">${u.credits_charged}</td>
            <td class="py-2 pr-3">${u.scale ? u.scale + 'x' : '—'}</td>
            <td class="py-2 pr-3">${u.face_enhance ? '✓' : '—'}</td>
            <td class="py-2 pr-3">${u.output_url ? `<a href="${u.output_url}" target="_blank" class="text-brand-600 dark:text-brand-400 underline">Xem ảnh</a>` : (u.error ? `<span class="text-red-400 max-w-[100px] block truncate" title="${u.error}">Lỗi</span>` : '—')}</td>
            <td class="py-2 text-slate-400">${new Date(u.created_at).toLocaleString('vi-VN')}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
      }

      let activeTab = 'tx';
      function renderTab(tab) {
        activeTab = tab;
        document.getElementById('udm-content').innerHTML = tab === 'tx' ? txHTML() : usageHTML();
        document.querySelectorAll('.udm-tab').forEach(b => {
          if (b.dataset.tab === tab) {
            b.className = 'udm-tab px-4 py-2 text-xs font-semibold rounded-t-lg border border-b-0 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-brand-600 dark:text-brand-400 transition-colors';
          } else {
            b.className = 'udm-tab px-4 py-2 text-xs font-semibold rounded-t-lg border border-b-0 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-colors';
          }
        });
      }
      document.querySelectorAll('.udm-tab').forEach(b => b.onclick = () => renderTab(b.dataset.tab));
      renderTab('tx');
    }

    /* ============================================================ */
    /* BOOT                                                           */
    /* ============================================================ */
    (async function boot() {
      await loadSession();
      render();
    })();
  </script>
</body>

</html>
